name: CI/CD Pipeline - GCP Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f core/requirements.txt ]; then pip install -r core/requirements.txt; fi

      - name: Django System Check
        run: |
          python core/manage.py check

  deploy:
    name: Deploy to GCP e2-micro
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.E2_HOST }}
          username: ${{ secrets.E2_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/cash-flow
            git pull origin main
            source venv/bin/activate
            pip install -r core/requirements.txt
            python core/manage.py migrate --noinput
            python core/manage.py collectstatic --noinput
